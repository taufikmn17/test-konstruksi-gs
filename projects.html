<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | WEB Contractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="relative min-h-screen">

    <!-- Navbar Wrapper (Otomatis dimuat oleh JavaScript) -->
    <div id="navbar-placeholder" class="fixed top-0 w-full z-50"></div>

    <!-- Main Portfolio Content -->
    <section id="projects" class="py-20 bg-white">

            <div class="flex justify-between items-end mb-12">

                <a href="projects.html" class="text-blue-900 font-bold border-b-2 border-blue-900 pb-1 hover:text-blue-600 transition">VIEW FULL GALLERY &rarr;</a>
            </div>
            
            <div id="projects-container" class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- Skeleton Loader (Akan muncul sementara data sedang diambil) -->
                <div class="bg-white rounded-lg overflow-hidden shadow-md animate-pulse">
                    <div class="h-64 sm:h-72 w-full bg-gray-200"></div>
                    <div class="p-5">
                        <div class="h-6 bg-gray-200 rounded w-3/4 mb-3"></div>
                        <div class="h-4 bg-gray-200 rounded w-1/2 mb-4"></div>
                        <div class="h-4 bg-gray-200 rounded w-full mb-2"></div>

                    </div>
                </div>
                <div class="bg-white rounded-lg overflow-hidden shadow-md animate-pulse">
                    <div class="h-64 sm:h-72 w-full bg-gray-200"></div>
                    <div class="p-5">
                        <div class="h-6 bg-gray-200 rounded w-3/4 mb-3"></div>

                    </div>
                </div>
                <div class="bg-white rounded-lg overflow-hidden shadow-md animate-pulse">
                    <div class="h-64 sm:h-72 w-full bg-gray-200"></div>
                    <div class="p-5">
                        <div class="h-6 bg-gray-200 rounded w-3/4 mb-3"></div>
                        <div class="h-4 bg-gray-200 rounded w-1/2 mb-4"></div>
                        <div class="h-4 bg-gray-200 rounded w-full mb-2"></div>
                        <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-blue-950 text-white py-10 mt-auto">
        <div class="container mx-auto px-6 text-center text-sm">
            &copy; 2026 WEB Contractor. All rights reserved.
        </div>
    </footer>

    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/projects.js"></script>

</body>
</html>
